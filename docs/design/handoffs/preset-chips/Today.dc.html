<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<x-dc>
<helmet>
  <title>Preset chips today</title>
  <style>
    body { margin: 0; font-family: "Motiva Sans", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="width: 300px; height: 360px; overflow: hidden; background: #0e141b; color: #e8eef5; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box;">

  <!-- tail of the answer above the dock, so the chips are seen against what sits over them -->
  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 0 10px 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end;">
    <div style="border-radius: 10px; border: 1px solid rgba(46,135,83,0.48); background: linear-gradient(180deg, rgba(46,135,83,0.12) 0%, rgba(18,52,34,0.55) 100%); color: #d4dde6; font-size: 12px; line-height: 1.4; padding: 8px 10px; box-sizing: border-box;">
      Drop the graphics preset to Medium and cap the frame rate at 40. That holds a steady picture and takes about 2 watts off the draw.
    </div>
  </div>

  <!-- THE DOCK -->
  <!-- preset row host: display grid, gap 3px in fade mode, margin-bottom 12px, overflow hidden -->
  <div style="display: grid; gap: 3px; margin-bottom: 12px; overflow: hidden; min-width: 0; width: 100%; box-sizing: border-box;">
    <!-- chips across: flex row, gap 4px, each chip an equal share => 148px on a 300px column -->
    <div style="display: flex; flex-direction: row; gap: 4px; width: 100%; min-width: 0;">
      <div style="flex: 1 1 0; min-width: 0;">
        <div style="height: 30px; box-sizing: border-box; border-radius: 4px; padding: 0 8px; background: rgba(18,26,34,0.22); border: 1px solid rgba(255,255,255,0.07); box-shadow: none; display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 12px; line-height: 1.2; color: #c4d3e2;">
          <span style="margin-right: 6px; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: #2e8753;">Tip</span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">How do I get past this p&#8230;</span>
        </div>
      </div>
      <div style="flex: 1 1 0; min-width: 0;">
        <div style="height: 30px; box-sizing: border-box; border-radius: 4px; padding: 0 8px; background: rgba(18,26,34,0.22); border: 1px solid rgba(255,255,255,0.07); box-shadow: none; display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 12px; line-height: 1.2; color: #c4d3e2;">
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Why is my Deck running&#8230;</span>
        </div>
      </div>
    </div>
  </div>

  <!-- the question box: glass card, 12px text, placeholder at half strength -->
  <div style="width: 100%; box-sizing: border-box; border-radius: 4px; background: rgba(18,26,34,0.25); border: 1px solid rgba(255,255,255,0.07); margin-bottom: 2px; display: flex; flex-direction: column;">
    <div style="min-height: 42px; padding: 6px 8px 2px 8px; box-sizing: border-box; font-size: 12px; line-height: 1.2; color: rgba(168,180,196,0.5);">
      Ask about this game, or your Deck&#8230;
    </div>
    <div style="height: 24px; padding: 0 2px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; color: rgba(168,180,196,0.5);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15l-5-5L5 21"></path><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
    </div>
  </div>

  <!-- the Ask button -->
  <div style="width: 100%; min-height: 36px; box-sizing: border-box; border-radius: 4px; background: rgba(18,26,34,0.35); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #c4d3e2;">
    ASK
  </div>

</div>
</x-dc>
</body>
</html>
