# Validate bonsai-mcp knowledge and that src/types/rpcMethods.ts matches main.py.
# (The architecture JSON maps are not saved in the repo any more; the tool server builds them.)
name: Validate MCP knowledge

on:
  push:
    paths:
      - "packages/bonsai-mcp/**"
      - "main.py"
      - "src/types/rpcMethods.ts"
      - ".github/workflows/validate-mcp.yml"
  pull_request:
    paths:
      - "packages/bonsai-mcp/**"
      - "main.py"
      - "src/types/rpcMethods.ts"
      - ".github/workflows/validate-mcp.yml"

jobs:
  validate-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP package dependencies
        run: npm ci
        working-directory: packages/bonsai-mcp

      - name: Validate knowledge + rpcMethods.ts freshness
        run: npm run validate -- --check-generated
        working-directory: packages/bonsai-mcp
        env:
          CI: true

      - name: Build MCP server
        run: npm run build
        working-directory: packages/bonsai-mcp
